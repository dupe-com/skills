name: Validate Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: curl -fsSL https://claude.ai/install.sh | bash -s 2.1.312

      - name: Validate the marketplace and each plugin
        run: |
          ~/.local/bin/claude plugin validate .
          for p in plugins/*/; do
            echo "🔌 $p"
            ~/.local/bin/claude plugin validate "$p"
            ~/.local/bin/claude plugin test "$p"
          done
